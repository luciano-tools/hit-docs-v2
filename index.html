<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIT DOCS v2 (Homologação)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .content {
            max-width: 800px;
            padding: 20px;
            transition: opacity 0.3s ease;
        }

        /* Título Principal */
        h1 {
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        h1 .highlight {
            color: #ff5500;
        }

        /* Badge v2 ciano/turquesa */
        .version-badge {
            background-color: rgba(0, 168, 181, 0.15);
            color: #00a8b5;
            border: 1.5px solid #00a8b5;
            font-size: 1.4rem;
            font-weight: 800;
            padding: 2px 12px;
            border-radius: 8px;
            letter-spacing: 0px;
            text-transform: lowercase;
            vertical-align: middle;
            box-shadow: 0 0 12px rgba(0, 168, 181, 0.3);
        }

        /* Subtítulo */
        p.subtitle {
            font-size: 1.1rem;
            font-style: italic;
            color: #cccccc;
            margin-bottom: 35px;
            font-weight: 300;
        }

        /* Botão de Entrar */
        .btn-entrar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #ff5500;
            color: #ffffff;
            font-weight: 700;
            font-size: 1rem;
            padding: 12px 32px;
            border-radius: 4px;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3);
            margin-top: 10px;
        }
        .btn-entrar:hover {
            background-color: #e04b00;
            transform: translateY(-2px);
        }
        .btn-entrar svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Rodapé com o Carrossel */
        .carousel-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 45px;
        }

        .carousel-arrow {
            background: transparent;
            border: none;
            color: #666;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s;
        }
        .carousel-arrow:hover {
            color: #fff;
        }

        .carousel-dots {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #555;
            cursor: pointer;
            transition: background-color 0.3s, width 0.3s;
        }

        .dot.active {
            width: 20px;
            border-radius: 4px;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="content">
        <!-- Título -->
        <h1 id="main-title">
            <span>ACESSE O <span class="highlight">HIT DOCS!</span></span>
            <span class="version-badge">v2</span>
        </h1>
        
        <!-- Subtítulo -->
        <p class="subtitle" id="main-subtitle">
            Processos, políticas, comunicados e templates centralizados em um só lugar.
        </p>

        <!-- Botão Entrar com o Link do SharePoint v2 -->
        <a id="portalLink" href="https://hitmail.sharepoint.com/sites/hitdocsv2/" target="_blank" class="btn-entrar">
            <svg viewBox="0 0 24 24">
                <path d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63l-4.54-2.26c-.24-.13-.51-.19-.79-.19H13V7.5c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.44-.72c-.09-.02-.17-.03-.26-.03-.36 0-.69.15-.92.39l-.82.84 5.3 5.31c.29.29.67.44 1.07.44h7.61c.74 0 1.37-.52 1.5-1.25l.93-5.27c.09-.52-.11-1.05-.53-1.35z"/>
            </svg>
            <span id="btn-text">Entrar</span>
        </a>

        <!-- Controles do Carrossel -->
        <div class="carousel-nav">
            <button class="carousel-arrow" onclick="prevSlide()" title="Anterior">&#10094;</button>
            <div class="carousel-dots">
                <div class="dot active" onclick="goToSlide(0)" title="Português"></div>
                <div class="dot" onclick="goToSlide(1)" title="Español"></div>
            </div>
            <button class="carousel-arrow" onclick="nextSlide()" title="Próximo">&#10095;</button>
        </div>
    </div>

    <script>
        const contentDiv = document.querySelector('.content');
        
        const slides = [
            {
                title: '<span>ACESSE O <span class="highlight">HIT DOCS!</span></span> <span class="version-badge">v2</span>',
                subtitle: 'Processos, políticas, comunicados e templates centralizados em um só lugar.',
                btn: 'Entrar'
            },
            {
                title: '<span>ACCEDE AL <span class="highlight">HIT DOCS!</span></span> <span class="version-badge">v2</span>',
                subtitle: 'Procesos, políticas, comunicados y plantillas centralizados en un solo lugar.',
                btn: 'Entrar'
            }
        ];

        let currentSlide = 0;
        let timer;

        function updateSlide(index) {
            contentDiv.style.opacity = 0;
            setTimeout(() => {
                currentSlide = index;
                document.getElementById('main-title').innerHTML = slides[currentSlide].title;
                document.getElementById('main-subtitle').textContent = slides[currentSlide].subtitle;
                document.getElementById('btn-text').textContent = slides[currentSlide].btn;
                
                const dots = document.querySelectorAll('.dot');
                dots.forEach((dot, idx) => {
                    if (idx === currentSlide) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                });

                contentDiv.style.opacity = 1;
            }, 250);
        }

        function nextSlide() {
            let next = (currentSlide + 1) % slides.length;
            updateSlide(next);
            resetTimer();
        }

        function prevSlide() {
            let prev = (currentSlide - 1 + slides.length) % slides.length;
            updateSlide(prev);
            resetTimer();
        }

        function goToSlide(index) {
            updateSlide(index);
            resetTimer();
        }

        function startAutoSlide() {
            timer = setInterval(() => {
                let next = (currentSlide + 1) % slides.length;
                updateSlide(next);
            }, 4000);
        }

        function resetTimer() {
            clearInterval(timer);
            startAutoSlide();
        }

        window.onload = function() {
            startAutoSlide();
            // Apenas inicia o carrossel, sem forçar abertura de janela automática.
        };
    </script>
</body>
</html>
